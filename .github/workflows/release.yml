name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: chomp-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$VERSION_INPUT"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a version such as 1.0.0"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists. Choose a new version."
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build, verify, and package
        run: bash Scripts/package-release.sh "$VERSION"
      - name: Publish release
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --title "Chomp $VERSION" \
            --notes-file .github/release-notes.md
